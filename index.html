<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <title>shared game</title>
    <style>
      html, body {
        margin: 0;
        height: 100%;
        background: #000;
        overflow: hidden;
        display: flex;
        align-items: center;
        justify-content: center;
        touch-action: none;
        user-select: none;
        -webkit-user-select: none;
        overscroll-behavior: none;
      }
      canvas {
        image-rendering: pixelated;
        image-rendering: crisp-edges;
      }
      #hint {
        position: fixed;
        bottom: 12px;
        left: 0;
        right: 0;
        text-align: center;
        color: rgba(255, 255, 255, 0.55);
        font: 12px monospace;
        pointer-events: none;
      }
      #status {
        position: fixed;
        top: calc(env(safe-area-inset-top) + 12px);
        left: calc(env(safe-area-inset-left) + 12px);
        color: rgba(255, 255, 255, 0.75);
        font: 12px monospace;
        pointer-events: none;
      }
      #touch-stick-base, #touch-stick-knob {
        position: fixed;
        display: none;
        border-radius: 50%;
        border: 2px solid rgba(255, 255, 255, 0.5);
        pointer-events: none;
      }
      #touch-stick-base {
        width: 100px;
        height: 100px;
        background: rgba(255, 255, 255, 0.08);
      }
      #touch-stick-knob {
        width: 44px;
        height: 44px;
        background: rgba(255, 255, 255, 0.35);
      }
      .chat-bubble {
        position: fixed;
        transform: translate(-50%, -100%);
        background: rgba(255, 255, 255, 0.95);
        color: #111;
        border: 2px solid #111;
        font: 13px monospace;
        padding: 4px 8px;
        max-width: 280px;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        pointer-events: none;
      }
      #chat-log {
        position: fixed;
        left: calc(env(safe-area-inset-left) + 12px);
        bottom: 40px;
        color: #fff;
        font: 12px monospace;
        text-shadow: 0 1px 2px #000;
        pointer-events: none;
      }
      #chat-input {
        position: fixed;
        left: 50%;
        transform: translateX(-50%);
        bottom: 36px;
        width: min(70vw, 400px);
        display: none;
        background: rgba(0, 0, 0, 0.7);
        border: 1px solid rgba(255, 255, 255, 0.4);
        color: #fff;
        font: 14px monospace;
        padding: 6px 10px;
        outline: none;
      }
      #chat-open {
        position: fixed;
        top: calc(env(safe-area-inset-top) + 8px);
        right: calc(env(safe-area-inset-right) + 12px);
        font-size: 22px;
        opacity: 0.8;
      }
      #mic-open {
        position: fixed;
        top: calc(env(safe-area-inset-top) + 48px);
        right: calc(env(safe-area-inset-right) + 12px);
        font-size: 22px;
      }
      #touch-jump, #touch-fire {
        position: fixed;
        right: calc(env(safe-area-inset-right) + 24px);
        bottom: calc(env(safe-area-inset-bottom) + 32px);
        width: 72px;
        height: 72px;
        border-radius: 50%;
        border: 2px solid rgba(255, 255, 255, 0.5);
        background: rgba(255, 255, 255, 0.15);
        color: rgba(255, 255, 255, 0.85);
        font: bold 24px monospace;
        display: flex;
        align-items: center;
        justify-content: center;
        touch-action: none;
        -webkit-tap-highlight-color: transparent;
      }
      #touch-fire {
        bottom: calc(env(safe-area-inset-bottom) + 120px);
      }
    </style>
  </head>
  <body>
    <div id="status"></div>
    <div id="hint">WASD move &middot; Shift sprint &middot; C crouch &middot; Space jump &middot; Q/E camera &middot; Enter chat &middot; V voice &middot; G bazooka &middot; H katana &middot; F shovel &middot; B bow (hold click) &middot; T build (1-4 material) &middot; R wheelchair &middot; click attack</div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
